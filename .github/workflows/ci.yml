name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: mimos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter Checks
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/mimos_test?schema=public"
          CLOUDFLARE_R2_BUCKET_NAME: "ci-dummy-bucket"
          CLOUDFLARE_R2_PUBLIC_URL: "https://dummy.r2.dev"
          ADMIN_SESSION_SECRET: "ci_dummy_session_secret_for_build_testing_123456789"
          AUTH_SECRET: "ci_dummy_auth_secret_for_build_testing_123456789"
